{{- $cluster := required "clusterName is required" .Values.clusterName -}}
# How Karpenter launches EC2 instances: AMI, IAM role, network and disks.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: apps
spec:
  # Fixed name created by Terraform; it has an EC2_LINUX access entry, so
  # nodes with it can join the cluster.
  role: {{ $cluster }}-karpenter-node
  amiSelectorTerms:
    - alias: {{ .Values.amiAlias }}
  # Private subnets and the EKS node security group (tagged by Terraform).
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ $cluster }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ $cluster }}
  # IMDSv2 only, hop limit 1: pods can't reach the instance metadata service
  # and borrow the node role (same as the system node group).
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: {{ .Values.diskSize }}
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  # Terraform's default_tags don't reach instances Karpenter launches, so the
  # cost allocation tags are repeated here.
  tags:
    Project: messagespring
    Environment: {{ required "environment is required" .Values.environment }}
    ManagedBy: karpenter
