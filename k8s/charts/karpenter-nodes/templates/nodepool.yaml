# Which nodes Karpenter may create for pending pods, and when it may remove
# them. Application pods select this pool with nodeSelector
# karpenter.sh/nodepool: apps (k8s/charts/web/values.yaml).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: apps
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: apps
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ toJson .Values.capacityTypes }}
        # The image is built for amd64. Graviton (arm64) is cheaper and is a
        # next step once CI builds a multi-arch image.
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: {{ toJson .Values.instanceCategories }}
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: [{{ .Values.instanceGenerationGreaterThan | quote }}]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: {{ toJson .Values.instanceCPUs }}
      {{- with .Values.taints }}
      taints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      expireAfter: {{ .Values.expireAfter }}
  disruption:
    {{- toYaml .Values.disruption | nindent 4 }}
  limits:
    {{- toYaml .Values.limits | nindent 4 }}
