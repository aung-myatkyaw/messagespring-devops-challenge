# prod: at least two pods in different zones, On-Demand nodes. Compare with
# values-dev.yaml.

# Changed only by the promote-to-prod pull request, which copies the reference
# dev is running. 123456789012 is a placeholder account ID.
image:
  repository: 123456789012.dkr.ecr.ap-southeast-7.amazonaws.com/messagespring/web
  tag: "0000000"

hpa:
  minReplicas: 2
  maxReplicas: 6

ingress:
  host: messagespring.example.com
  # infra/envs/prod output alb_logs_bucket_name (placeholder account ID).
  accessLogsBucket: messagespring-prod-alb-logs-123456789012-ap-southeast-7

networkPolicy:
  # Public subnets of the prod VPC (infra/envs/prod output public_subnet_cidrs).
  albSourceCidrs:
    - 10.20.48.0/24
    - 10.20.49.0/24
    - 10.20.50.0/24
