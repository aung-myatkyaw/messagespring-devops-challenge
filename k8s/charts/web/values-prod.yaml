# prod: at least two pods in different zones, On-Demand nodes. Compare with
# values-dev.yaml.

# Changed only by the promote-to-prod pull request, which copies the reference
# dev is running.
#
# Account ID 123456789012 and example.com are placeholders until
# scripts/set-env-values.sh writes the real ones.
image:
  repository: 582415712618.dkr.ecr.ap-southeast-7.amazonaws.com/messagespring/web
  tag: "5400061"

hpa:
  minReplicas: 2
  maxReplicas: 6

ingress:
  host: messagespring.example.com
  # infra/envs/prod output alb_logs_bucket_name.
  accessLogsBucket: messagespring-prod-alb-logs-123456789012-ap-southeast-7

networkPolicy:
  # Public subnets of the prod VPC (infra/envs/prod output public_subnet_cidrs).
  albSourceCidrs:
    - 10.20.48.0/24
    - 10.20.49.0/24
    - 10.20.50.0/24
