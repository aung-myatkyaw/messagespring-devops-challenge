{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.albSourceCidrs }}
{{- fail "networkPolicy.albSourceCidrs must list the public subnet CIDRs" }}
{{- end }}
# Enforced by the VPC CNI network policy agent. Once a pod is selected by a
# policy, everything not listed is denied:
#   ingress: only the ALB (from the public subnets) on the app port
#   egress:  only DNS; the app makes no outbound calls
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "web.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "web.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range .Values.networkPolicy.albSourceCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
