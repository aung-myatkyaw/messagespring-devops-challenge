# Where ExternalSecrets read from: Parameter Store in this cluster's region,
# with the operator's own credentials (Pod Identity, no keys). The IAM policy
# limits it to /messagespring/<env>/*, so dev can never read prod's values.
#
# Synced in the same Application as the operator, after its Deployments are
# Healthy (wave 1), so the CRD exists and the webhook answers. The dry run is
# skipped on the first sync, while the CRD isn't installed yet.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: parameter-store
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-southeast-7
  # Only these namespaces may use the store. The apps project can't create
  # ExternalSecrets either; application secrets would get their own path.
  conditions:
    - namespaces:
        - external-dns
        - logging
