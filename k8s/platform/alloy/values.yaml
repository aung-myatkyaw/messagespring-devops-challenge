# Values for the Grafana Alloy chart (grafana repository), shared by dev and
# prod; values-<env>.yaml sets the cluster label.
#
# A DaemonSet: one Alloy per node reads that node's container log files under
# /var/log/pods (hostPath, read-only), adds Kubernetes labels and pushes to
# Loki. Reading files is cheaper and more reliable than streaming every log
# through the API server, and keeps working while the API server is busy.

controller:
  type: daemonset
  # Every node, whatever its taints: the system nodes (CriticalAddonsOnly) and
  # dev's Spot nodes (spot=true).
  tolerations:
    - operator: Exists
  # Positions file (how far each log file has been read), so a container
  # restart neither re-sends nor skips lines.
  volumes:
    extra:
      - name: storage
        emptyDir: {}

alloy:
  # The chart's default HOSTNAME env var is the node name; the config uses it
  # to discover only this node's pods.
  mounts:
    varlog: true
    extra:
      - name: storage
        mountPath: /tmp/alloy
  storagePath: /tmp/alloy

  # Root is needed to read the kubelet's log files (owned by root, mode 0640);
  # everything else is locked down: no capabilities, no privilege escalation,
  # read-only root filesystem, read-only host mount.
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  # No usage statistics sent to Grafana Labs.
  enableReporting: false

  configMap:
    content: |
      // Pods scheduled on this node only (HOSTNAME is the node name).
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      // Labels become Loki streams, so keep them few and low-cardinality:
      // namespace, app, pod, container. pod is fine at this size; with many
      // short-lived pods it would move to structured metadata.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        // /var/log/pods/<namespace>_<pod>_<uid>/<container>/<restart>.log
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        // containerd writes the CRI format: "<time> <stream> <flag> <line>".
        stage.cri {}

        // The file name is unique per pod and restart: too many streams.
        stage.label_drop {
          values = ["filename"]
        }

        forward_to = [loki.write.loki.receiver]
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
        }
        external_labels = {
          cluster = sys.env("CLUSTER_NAME"),
        }
      }

# RBAC: only what the config above uses, list and watch pods. The chart's
# default role also reads every Secret and ConfigMap in the cluster, and its
# template can't render a role with a single rule list, so the chart's RBAC is
# off and the role is defined here.
rbac:
  create: false
extraObjects:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: alloy
    rules:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list", "watch"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: alloy
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: alloy
    subjects:
      - kind: ServiceAccount
        name: alloy
        namespace: alloy

# The PodLogs CRD is for a Kubernetes-API log source we don't use.
crds:
  create: false
