# Buckets from infra/envs/prod (log-storage module). Account ID 123456789012 is
# a placeholder until scripts/set-env-values.sh writes the real one.
loki:
  storage:
    bucketNames:
      chunks: messagespring-prod-loki-chunks-123456789012-ap-southeast-7
      ruler: messagespring-prod-loki-ruler-123456789012-ap-southeast-7
  # Same as loki_retention_days = 30 in infra/envs/prod/terraform.tfvars.
  limits_config:
    retention_period: 720h
