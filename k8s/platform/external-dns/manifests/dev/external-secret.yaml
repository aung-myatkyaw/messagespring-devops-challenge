# The Cloudflare token for external-dns, copied from Parameter Store into a
# Secret in this namespace. Terraform creates the parameter with a placeholder;
# an administrator writes the real token before Argo CD is bootstrapped
# (docs/runbooks/cluster-bootstrap.md).
#
# Wave -1: the Secret exists before the external-dns Deployment starts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: external-dns
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: parameter-store
  # A rotated token reaches the Secret within the hour; external-dns reads it
  # at start-up, so restart it after rotating.
  refreshInterval: 1h
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: /messagespring/dev/external-dns/cloudflare-api-token
