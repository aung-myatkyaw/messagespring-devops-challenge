# Grafana's admin credentials. Terraform generates the password (ephemeral,
# never in state) and writes it to Parameter Store; this copies it into the
# Secret the Grafana chart reads. The user name isn't secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: logging
  annotations:
    # Before the Grafana Deployment, so its first pod finds the Secret.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: parameter-store
  refreshInterval: 1h
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: /messagespring/dev/grafana/admin-password
