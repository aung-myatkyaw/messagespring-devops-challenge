# Values for the Grafana chart (grafana-community repository), the same in
# dev and prod. Grafana is internal only: no Ingress, reached with
#   kubectl -n logging port-forward svc/grafana 3000:80
#
# Stateless: the Loki data source is provisioned from this file and nothing is
# kept on a volume, so a restart or a new pod changes nothing that matters.
# (Dashboards would be provisioned the same way, from ConfigMaps in Git.)

# The admin password comes from Parameter Store through the ExternalSecret in
# manifests/<env>/. The chart must not generate one: Argo CD renders the chart
# on every refresh, so a generated password would change each time.
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.logging.svc.cluster.local:3100
        isDefault: true
        editable: false

grafana.ini:
  analytics:
    reporting_enabled: false
    check_for_updates: false
  # Next step: sign-in through IAM Identity Center (OIDC) instead of the
  # local admin user.
  auth.anonymous:
    enabled: false
  # Grafana otherwise downloads a set of app plugins from grafana.com on every
  # start. That's unpinned code from the internet at runtime, repeated on each
  # restart because nothing is persisted, and the download spike OOM-killed the
  # pod. The Loki data source is built in; no plugins are needed.
  plugins:
    preinstall_disabled: true

nodeSelector:
  role: system
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
    effect: NoSchedule

# Grafana 13 needs more than 256Mi at startup (database migrations, the
# unified storage index). The chart sets GOMEMLIMIT from the limit.
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 512Mi

# Helm test pod; Argo CD doesn't run Helm tests.
testFramework:
  enabled: false
