# Argo CD's namespace. Terraform's bootstrap creates it (helm_release
# create_namespace); Argo CD then adopts it from here and adds the labels. All
# Argo CD pods meet the "restricted" profile (checked on the rendered chart).
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
