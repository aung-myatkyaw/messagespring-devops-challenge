# Platform-owned namespace for the external-dns add-on (see web.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
  labels:
    # The chart's pods meet the "restricted" profile (checked on the
    # rendered manifests), so the strictest level is enforced here too.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
