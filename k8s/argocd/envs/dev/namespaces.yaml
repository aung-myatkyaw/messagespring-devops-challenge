apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
  # No resources-finalizer: deleting this Application must not delete the
  # namespaces and everything in them. The Namespaces also carry Prune=false.
spec:
  project: platform
  source:
    repoURL: https://github.com/aung-myatkyaw/messagespring-devops-challenge.git
    targetRevision: main
    path: k8s/platform/namespaces
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
