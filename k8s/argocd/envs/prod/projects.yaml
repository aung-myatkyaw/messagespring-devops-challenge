# Children of the root Application (infra/modules/argocd-bootstrap). Sync waves
# order them; the root waits for each wave's Applications to be Healthy before
# starting the next (Application health check in k8s/platform/argo-cd):
#
#   -10  argocd-projects               AppProjects
#    -9  namespaces                    Namespaces (Pod Security, readiness gate)
#    -8  argocd, storage               Argo CD itself; default gp3 StorageClass
#    -7  karpenter                     node autoscaler + CRDs
#    -6  karpenter-nodes               EC2NodeClass + NodePool "apps"
#    -5  aws-load-balancer-controller  Ingress -> ALB, pod readiness gate
#        metrics-server                Metrics API for the HPA
#    -4  external-secrets              operator + ClusterSecretStore
#    -3  external-dns                  Cloudflare records for Ingress hosts
#    -2  loki                          log storage (S3)
#    -1  alloy, grafana                log agent per node; log UI
#    10  web                           the application

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-projects
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  # No resources-finalizer: deleting this Application must not delete the
  # AppProjects every other Application belongs to.
spec:
  project: root
  source:
    repoURL: https://github.com/aung-myatkyaw/messagespring-devops-challenge.git
    targetRevision: main
    path: k8s/argocd/projects
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
