# Local guardrails. The same checks run in CI so they can't be skipped.
# Install: pre-commit install   (installs pre-commit + commit-msg hooks)
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]   # only the commit-msg hook runs at commit-msg

repos:
  # Generic hygiene + cheap secret detection
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^k8s/.*/templates/   # Helm templates aren't plain YAML
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      # detect-aws-credentials is deliberately omitted: it matches against the
      # developer's local ~/.aws/credentials (false positives); gitleaks covers it.

  # Secret scanning over the staged diff (the secret-scan workflow covers the
  # whole history in CI; keep the version in step with
  # scripts/install-ci-tools.sh)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Terraform: format, validate, lint
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.4
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args: [--hook-config=--retry-once-with-cleanup=true]
      - id: terraform_tflint
        args: [--args=--config=__GIT_WORKING_DIR__/infra/.tflint.hcl]

  # GitHub Actions: syntax, expressions and shellcheck on run: blocks...
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # ...then a security audit: unpinned actions, template injection,
  # persisted credentials, over-broad permissions.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor

  # Conventional Commits on the commit message
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Tools installed locally (brew install hadolint kubeconform helm yq);
  # CI installs pinned versions with scripts/install-ci-tools.sh
  - repo: local
    hooks:
      - id: hadolint
        name: hadolint (Dockerfile lint)
        entry: hadolint
        language: system
        files: (^|/)Dockerfile$
      # Raw manifests, local Helm charts with every values-<env>.yaml, and the
      # upstream charts of the platform Applications with our values: render,
      # then schema-check the output (same script as CI).
      - id: validate-k8s
        name: validate-k8s (helm lint + template | kubeconform)
        entry: scripts/validate-k8s.sh
        language: system
        files: ^(k8s/|scripts/validate-k8s\.sh$)
        pass_filenames: false
