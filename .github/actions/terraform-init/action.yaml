# Shared setup for the jobs that talk to a real Terraform backend (plan on
# pull requests, apply after merge): pinned Terraform, AWS credentials from
# the given role through OIDC, and `init` against the S3 state bucket.
# The caller checks out the repository first and grants id-token: write.
name: terraform init
description: Install Terraform, assume an AWS role through OIDC and initialise a root module.

inputs:
  root:
    description: Root module directory, e.g. infra/envs/dev
    required: true
  role-arn:
    description: IAM role to assume (plan or apply role)
    required: true
  aws-region:
    description: AWS region of the state bucket and resources
    required: true
  state-bucket:
    description: S3 state bucket, passed to the partial backend configuration
    required: true

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: 1.17.1 # same as infra.yaml's static checks
        # Plain terraform: the wrapper rewrites stdout and exit codes, and the
        # plan step relies on -detailed-exitcode.
        terraform_wrapper: false

    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-arn }}
        role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
        aws-region: ${{ inputs.aws-region }}

    # -lockfile=readonly: CI installs exactly the providers in the committed
    # lock file and never rewrites it.
    - name: terraform init
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
        STATE_BUCKET: ${{ inputs.state-bucket }}
      run: terraform -chdir="$ROOT" init -input=false -lockfile=readonly -backend-config="bucket=$STATE_BUCKET"
