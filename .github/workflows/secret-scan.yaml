# Scan the repository's whole Git history for committed secrets.
#
# The gitleaks pre-commit hook only sees what is being committed on one
# machine, and only if hooks are installed. This scans every commit reachable
# from the branch, including ones made with hooks skipped, so a secret that
# was committed and then deleted is still caught (it lives on in history and
# has to be rotated). It runs on every pull request, so it can be a required
# check.
name: secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same version as the pre-commit hook. The checksum is the release asset's
  # published SHA-256, so a replaced download fails the job.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The plain binary rather than gitleaks-action: no licence key to store,
      # and the version and checksum are pinned here.
      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      # --redact keeps secret values out of the log and the report.
      - name: Scan every commit
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner \
            --report-format sarif --report-path gitleaks.sarif .

      # Code scanning needs GitHub Advanced Security on private repositories.
      - name: Upload results
        if: ${{ !cancelled() && !github.event.repository.private && hashFiles('gitleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
