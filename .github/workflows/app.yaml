# The web application's pipeline. CI never talks to the cluster: it builds and
# scans an image, pushes it to ECR, and records the new tag in Git. Argo CD
# sees the commit and rolls it out.
#
#   pull request   lint + typecheck -> build -> scan          (nothing pushed)
#   push to main   lint + typecheck -> build -> scan -> push to ECR
#                  -> commit the tag to values-dev.yaml       (Argo CD deploys dev)
#                  -> open/update the promote-to-prod PR      (merge = deploy prod)
#
# The AWS and Git-writing steps run only when the repository is configured
# (variables AWS_ROLE_ARN, ECR_REPOSITORY, RELEASE_APP_CLIENT_ID; secret
# RELEASE_APP_PRIVATE_KEY), so the pipeline stays green without them. Setup:
# docs/runbooks/github-setup.md.
#
# No loop: the release commits only touch k8s/, which doesn't match the push
# paths below, so they never trigger a release again.
name: app

on:
  push:
    branches: [main]
    paths:
      - application/**
      - .github/workflows/app.yaml
      - .github/workflows/_docker.yaml
  # Every pull request, so "app ok" can be a required check; the jobs skip
  # when the application didn't change.
  pull_request:
  workflow_dispatch:

# Every job asks for what it needs; nothing by default.
permissions: {}

# One run per branch. A newer push cancels an older run on a pull request; on
# main, runs queue instead, so releases are never cut off halfway and land in
# commit order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      # Pushes are already filtered by the trigger's paths.
      app: ${{ github.event_name != 'pull_request' || steps.filter.outputs.app == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            app:
              - application/**
              - .github/workflows/app.yaml
              - .github/workflows/_docker.yaml

  quality:
    name: lint and typecheck
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: application/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck

  image:
    name: image
    needs: quality
    permissions:
      contents: read
      id-token: write
      security-events: write
    # A job-level reusable workflow is resolved from this same commit when the
    # run starts, never from the runner's filesystem, so './' is safe here.
    uses: ./.github/workflows/_docker.yaml # zizmor: ignore[self-repository]
    with:
      context: application
      image-name: web
      # Only main may push: the ECR role trusts only tokens for refs/heads/main.
      push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      aws-region: ${{ vars.AWS_REGION || 'ap-southeast-7' }}
      aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
      ecr-repository: ${{ vars.ECR_REPOSITORY }}

  # Deploying to dev is a commit to main that changes the image in
  # values-dev.yaml. It's made with a GitHub App token rather than GITHUB_TOKEN:
  # commits pushed with GITHUB_TOKEN don't trigger workflows, so the manifest
  # checks wouldn't run on them; and an App can be the one bypass actor allowed
  # past the main branch ruleset, with no personal access token involved.
  deploy-dev:
    name: deploy to dev (Git)
    needs: image
    if: needs.image.outputs.pushed == 'true' && vars.RELEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    # Every workflow that commits to main shares this group, so two release
    # commits never race.
    concurrency:
      group: gitops-main
      cancel-in-progress: false
    env:
      REPOSITORY: ${{ needs.image.outputs.repository }}
      TAG: ${{ needs.image.outputs.tag }}
    steps:
      # Short-lived (1 hour) installation token, narrowed to what this job
      # needs, and revoked when the job ends.
      - name: GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # Keeps the App token in .git/config because the push below needs it.
      # This job uploads no artifacts, and the token is revoked when it ends.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked]
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Commit as the App's bot user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"

      - name: Point dev at the new image
        run: scripts/set-image.sh dev "$REPOSITORY" "$TAG"

      # Other commits may land on main while this runs: rebase and retry.
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "::notice::dev already runs $TAG"
            exit 0
          fi
          git commit -am "chore(release): deploy web $TAG to dev"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "### dev now runs \`$REPOSITORY:$TAG\`" >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing on main"
            git pull --rebase origin main
          done
          exit 1

  # Production changes only through this pull request: it sets values-prod.yaml
  # to the image dev is running. Merging it is the approval; Argo CD then
  # deploys prod. One branch (promote/prod), so a newer build updates the open
  # PR instead of opening another.
  promote:
    name: open promote-to-prod PR
    needs: [image, deploy-dev]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    concurrency:
      group: gitops-main
      cancel-in-progress: false
    env:
      REPOSITORY: ${{ needs.image.outputs.repository }}
      TAG: ${{ needs.image.outputs.tag }}
    steps:
      - name: GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # This job's GITHUB_TOKEN has no permissions, so it can't read a private
      # repository: check out with the App token. Not persisted, because
      # create-pull-request pushes with its own token input.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Point prod at the image dev runs
        run: |
          previous=$(yq '.image.tag' k8s/charts/web/values-prod.yaml)
          scripts/set-image.sh prod "$REPOSITORY" "$TAG"
          {
            echo "Deploys \`$REPOSITORY:$TAG\` to **prod**: the image dev is running now, built once and"
            echo "scanned in [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            if [[ $previous =~ ^[0-9a-f]{7,40}$ && $previous != 0000000 ]]; then
              echo "Changes since the current prod release: [\`$previous...$TAG\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous...$TAG)"
              echo
            fi
            echo "Merging is the production approval; Argo CD rolls it out. A newer build"
            echo "updates this pull request. To roll back later, revert the merge commit."
          } >"$RUNNER_TEMP/pr-body.md"

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: promote/prod
          base: main
          add-paths: k8s/charts/web/values-prod.yaml
          commit-message: "chore(release): promote web ${{ env.TAG }} to prod"
          title: "chore(release): promote web ${{ env.TAG }} to prod"
          body-path: ${{ runner.temp }}/pr-body.md
          # Whoever merged the change owns getting it to prod.
          assignees: ${{ github.actor }}
          labels: release
          # Committed through the API as the App, so the commit is signed.
          sign-commits: true
          delete-branch: true

  ok:
    name: app ok
    # The required check: always reports, even when the build was skipped
    # because the application didn't change. Release jobs aren't included;
    # they only run on main, after the merge.
    if: always()
    needs: [changes, quality, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "job results: $RESULTS"
          if grep -qE '"(failure|cancelled)"' <<<"$RESULTS"; then
            exit 1
          fi
